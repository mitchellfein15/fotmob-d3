<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Local D3 soccer analysis from Spiideo XML exports"><title>D3 Matchroom</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="brand" href="/">D3<span> / </span>MATCHROOM</a><span class="private">LOCAL WORKSPACE</span></header>
<main><div class="eyebrow">MEN’S SOCCER <span>/</span> MATCH ANALYSIS</div>
<section id="imports" class="panel import-panel" aria-label="Match imports"></section>
<section id="match-header" class="match" hidden><div class="team"><div class="crest"></div><div><small>TEAM</small><h1></h1></div></div><div class="score"><strong>— : —</strong><span>Goals in imported events</span></div><div class="team away"><div><small>TEAM</small><h1></h1></div><div class="crest"></div></div></section>
<div id="match-notice" class="notice" hidden><div><strong>Ratings pending</strong><p>Playing time and completeness remain unverified.</p></div><button id="manage">Import details</button></div>
<div id="summary" class="summary" hidden></div>
<nav aria-label="Match views"><button data-view="players" class="active">Players</button><button data-view="timeline">Event timeline</button><button data-view="lineups">Lineups & minutes</button><button data-view="data">Import details</button></nav>
<section id="content"></section><footer>D3 MATCHROOM <span>Private analysis workspace · Spiideo XML exports</span></footer></main>
<dialog id="detail"><button id="close" class="close" aria-label="Close player details">×</button><div id="detail-body"></div></dialog><script type="module" src="/app.js"></script></body></html>
