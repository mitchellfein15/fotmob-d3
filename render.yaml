services:
  - type: web
    name: d3-matchroom
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci && npm run check
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: matchroom-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.x
      - key: DATA_DIR
        value: /var/data/matchroom
      - key: ADMIN_PASSWORD
        generateValue: true
